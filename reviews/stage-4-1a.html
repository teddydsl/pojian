<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1d3227">
  <title>茧林探索 · 破茧（4.1A 小路修订）</title>
  <link rel="icon" type="image/svg+xml" href="../public/assets/icons/forest.svg">
  <style>
    :root{--ink:#24382b;--paper:#f8f5e9ee;--green:#284c36;--gold:#e0bd80}
    *{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{background:#c5d2c0;color:var(--ink);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button{font:inherit;cursor:pointer}button[hidden],[hidden]{display:none!important}
    #viewport{position:fixed;inset:0;overflow:hidden}#viewport canvas{display:block;width:100%;height:100%;touch-action:none}.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 48%,transparent 42%,#1d2b2347 100%)}
    .top{position:fixed;z-index:12;left:20px;right:20px;top:18px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.brand{display:flex;align-items:center;gap:12px;border-radius:999px;border:1px solid #ffffff55;background:#173124e3;backdrop-filter:blur(15px);color:white;padding:9px 15px;box-shadow:0 10px 35px #253b2b2e}.brand strong{font-family:Georgia,"Songti SC",serif;font-size:21px;letter-spacing:.13em;line-height:1}.brand span{border-left:1px solid #ffffff66;padding-left:12px;font-size:10px;font-weight:800;letter-spacing:.05em;color:#e8e6d3}.top-actions{display:flex;align-items:center;gap:8px}.location{max-width:280px;border:1px solid #ffffff90;border-radius:99px;background:#f7f2e5dd;backdrop-filter:blur(12px);padding:9px 13px;color:#35513d}.location b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.location small{display:block;color:#73816f;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.settings-button{height:40px;min-width:40px;border:1px solid #ffffffa0;border-radius:50%;background:#f7f2e5ec;color:#34513c;font-size:20px;box-shadow:0 8px 25px #23362d3d}.settings-button:hover,.settings-button[aria-expanded="true"]{background:#fff9ed}
    .task-panel,.settings-panel{position:fixed;z-index:12;border:1px solid #ffffffbd;border-radius:17px;background:var(--paper);backdrop-filter:blur(18px);box-shadow:0 12px 38px #29433236}.task-panel{left:20px;top:99px;width:238px;max-height:min(58vh,560px);overflow:auto;padding:16px}.eyebrow{font-size:10px;color:#81907c;letter-spacing:.14em;font-weight:900}.task-panel h2,.settings-panel h2{font-family:Georgia,"Songti SC",serif;font-size:17px;margin:5px 0 10px}.task-panel ol{padding:0;margin:0;list-style:none}.task-panel li{display:flex;gap:7px;align-items:flex-start;padding:6px 0;border-bottom:1px solid #e4e8de;color:#758373;font-size:10px;line-height:1.4}.task-panel li:last-child{border:0}.task-panel li span{font-size:14px;line-height:1;color:#a6b1a1}.task-panel li.done{color:#335b3d;font-weight:800}.task-panel li.done span{color:#4d9861}.record{margin-top:10px;border-top:1px solid #dfe5da;padding-top:9px}.record strong{font-size:10px;color:#4d6550}.record strong b{font-size:12px}.explored-list{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.explored-chip{font-size:9px;color:#7b897b;border:1px solid #d3dacb;border-radius:99px;padding:4px 6px;background:#fffaf0}.explored-chip.seen{color:#2e6540;border-color:#a8caa9;background:#e6f0df}
    .settings-panel{right:20px;top:70px;width:245px;padding:16px}.settings-panel .setting-row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:10px 0;font-size:11px;color:#4d6650}.settings-panel button:not(.close-settings){border:1px solid #b8c7b4;border-radius:9px;background:#f3f6ee;color:#365841;padding:7px 9px;font-size:10px;font-weight:800}.settings-panel button:hover{background:#e4eddf}.settings-panel button:disabled{opacity:.48;cursor:not-allowed}.settings-panel .wide{width:100%;margin-top:5px}.settings-panel .close-settings{float:right;border:0;background:transparent;color:#637661;font-size:18px;padding:0 2px}.settings-panel .fine{display:block;margin-top:10px;color:#80907e;font-size:9px;line-height:1.5}.settings-panel .metric{border-top:1px solid #dce4d8;padding-top:10px;margin-top:10px;font-size:10px;color:#667866}
    .controls-dock{position:fixed;z-index:10;left:20px;bottom:23px;width:190px;padding:10px 12px;border:1px solid #ffffff66;border-radius:13px;background:#173d2d88;backdrop-filter:blur(12px);color:#f1f6eb;box-shadow:0 6px 24px #172c2450;opacity:.58;transition:opacity .2s}.controls-dock:hover,.controls-dock:focus-within{opacity:.9}.controls-dock .dock-title{font-size:9px;font-weight:900;letter-spacing:.1em;color:#f8fcf3}.control-line{display:flex;align-items:center;gap:7px;margin-top:5px;font-size:10px;text-shadow:0 1px 3px #142b23}.keys{display:inline-flex;gap:3px}.key{min-width:19px;text-align:center;border:1px solid #ffffff8a;border-radius:4px;background:#fffef1ba;color:#385441;font-size:9px;font-weight:900;padding:2px 3px;text-shadow:none}
    .bottom{position:fixed;z-index:10;left:50%;bottom:24px;transform:translateX(-50%);width:min(560px,calc(100% - 30px));display:flex;align-items:center;gap:12px;padding:10px 10px 10px 18px;border:1px solid #ffffff94;background:#193126e8;backdrop-filter:blur(17px);border-radius:999px;box-shadow:0 12px 35px #152c2378;color:#fff}.bottom p{flex:1;margin:0;font-size:12px;line-height:1.3;color:#e3eadf}.bottom button{border:0;border-radius:999px;background:var(--gold);color:#243d2b;padding:10px 15px;font-size:12px;font-weight:900;white-space:nowrap}.bottom button:hover{background:#efd29e}
    .toast{position:fixed;z-index:20;left:50%;top:105px;transform:translate(-50%,-12px);opacity:0;pointer-events:none;max-width:min(520px,calc(100% - 32px));background:#173327ed;color:#f9f5e9;border:1px solid #f5e8c87c;border-radius:999px;box-shadow:0 12px 35px #1d342a5c;padding:11px 19px;font-size:13px;text-align:center;transition:opacity .23s,transform .23s}.toast.visible{opacity:1;transform:translate(-50%,0)}.fade{position:fixed;z-index:15;inset:0;pointer-events:none;background:#e8e1ce;opacity:0;transition:opacity .32s}.fade.on{opacity:1}.failure,.link-fallback{position:fixed;z-index:30;left:50%;top:50%;transform:translate(-50%,-50%);width:min(410px,calc(100% - 32px));background:#fff9ee;border:1px solid #c69a69;border-radius:15px;padding:22px;color:#573d29;box-shadow:0 20px 60px #0004}.link-fallback h2{font-size:17px;margin:0 0 7px}.link-fallback p{font-size:12px;line-height:1.6}.link-fallback a{display:inline-block;margin-right:10px;color:#345e42;font-weight:800;font-size:12px}.link-fallback button{border:0;background:transparent;color:#7c715d;text-decoration:underline;font-size:12px}.loading{position:fixed;z-index:40;inset:0;display:grid;place-items:center;background:#e6dfca;color:#36523c;font-weight:900;letter-spacing:.1em}
    @media(max-width:1050px){.controls-dock{bottom:86px}}
    @media(max-width:750px){.task-panel{top:84px;left:12px;width:min(215px,calc(100% - 24px));max-height:46vh}.settings-panel{right:12px;top:62px}.top{left:12px;right:12px;top:11px}.brand strong{font-size:18px}.brand span{font-size:9px}.location{display:none}.controls-dock{left:12px;bottom:72px;width:145px;padding:7px;opacity:.45}.controls-dock .control-line{font-size:8px}.bottom{bottom:10px}.bottom p{font-size:10px}.bottom button{font-size:10px;padding:9px}.toast{top:75px;font-size:11px}}
  </style>
</head>
<body>
  <div id="viewport"></div><div class="vignette"></div><div id="loading" class="loading">正在进入茧林…</div>
  <header class="top"><div class="brand"><strong>破茧</strong><span>阶段 4.1A · 林间小路</span></div><div class="top-actions"><div class="location"><b id="place">阿吉的家</b><small id="hint">环顾穹顶，探索面板与出口</small></div><button id="settings-button" class="settings-button" type="button" aria-expanded="false" aria-controls="settings-panel" aria-label="打开设置">⚙</button></div></header>
  <aside id="task-panel" class="task-panel" aria-label="任务面板"><div class="eyebrow">EXPLORATION TASKS</div><h2>探索任务</h2><ol id="checklist"></ol><div class="record"><strong>已探索 <b id="explored-count">0 / 3</b></strong><div class="explored-list" id="explored-list"></div></div></aside>
  <aside id="settings-panel" class="settings-panel" aria-label="游戏设置" hidden><button id="close-settings" class="close-settings" type="button" aria-label="关闭设置">×</button><div class="eyebrow">SETTINGS</div><h2>设置</h2><div class="setting-row"><span>环境声音</span><button id="sound-button" type="button" aria-pressed="false">关闭</button></div><div class="setting-row"><span>任务面板</span><button id="task-toggle" type="button" aria-pressed="true">显示</button></div><div class="metric">渲染帧率 <b id="fps-value">检测中</b></div><button id="entrance-button" class="wide" type="button">关闭苔坡树桩</button><button id="reset-button" class="wide" type="button">重置当前位置</button><button id="clear-exploration" class="wide" type="button">清空本机探索记录</button><span class="fine">声音需点击开启。正式标签与数据地址仍待接入。</span></aside>
  <div class="controls-dock" aria-label="操作按键"><div class="dock-title">操作</div><div class="control-line"><span class="keys"><span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span></span><span>移动</span></div><div class="control-line"><span class="key">鼠标</span><span>调整视角</span></div><div class="control-line"><span class="key">E</span><span>互动／打开数据</span></div></div>
  <div class="bottom"><p id="interaction-prompt">靠近前方出口，按 E 互动</p><button id="action-button" type="button" hidden>互动</button></div>
  <div class="toast" id="toast" role="status"></div><div class="fade" id="fade"></div><div class="failure" id="failure" hidden></div>
  <div class="link-fallback" id="link-fallback" hidden><h2>数据页未能自动打开</h2><p id="link-error">浏览器可能拦截了新标签。可以使用下方链接重试，游戏位置会保留。</p><a id="fallback-data-link" href="#" target="_blank" rel="noopener">重试打开数据页 ↗</a><button id="close-fallback" type="button">关闭提示</button></div>
  <script src="./snapshots/stage-4-1a-r2.assets.js"></script>
  <script src="./snapshots/stage-4-1a-r2.js"></script>
</body>
</html>
