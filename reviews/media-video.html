<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#25392c"><title>茧林影像 · 破茧</title><link rel="icon" href="../public/assets/icons/forest.svg"><style>
*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(ellipse at top,#e9d9bd,#cbc9af);color:#344834;padding:28px}main{max-width:1000px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px}.brand{font-family:Georgia,"Songti SC",serif;font-size:25px;font-weight:700;letter-spacing:3px}small{font-size:12px;color:#778165}h1{font-size:18px;margin:0 0 6px}p{font-size:13px;line-height:1.8;color:#64735b}.screen{background:#19231c;border:8px solid #f1e4c9;border-radius:23px;overflow:hidden;box-shadow:0 20px 65px #334a3240}video{display:block;width:100%;max-height:75vh;background:#19231c}nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}a{display:inline-block;text-decoration:none;color:#416044;background:#f3ebd8;border:1px solid #b9c5a8;border-radius:99px;padding:9px 16px;font-size:12px}a[aria-current="page"]{color:#fff5dd;background:#416044}a:focus-visible{outline:3px solid #aa7b41;outline-offset:3px}.error{color:#8b4630}footer{margin-top:20px}@media(max-width:600px){body{padding:15px}.screen{border-width:5px}header{align-items:flex-start}.brand{font-size:21px}small{font-size:10px}}
</style></head><body><main><header><div class="brand">破茧 <small>茧林影像</small></div><div><h1 id="title">加载视频</h1><small>一块吊牌，一个不同的视角</small></div></header><div class="screen"><video id="player" controls playsinline autoplay preload="metadata"></video></div><p id="status" role="status">如果视频没有自动播放，请点击播放。切回游戏标签即可继续探索，角色位置会保留。</p><nav id="videos" aria-label="选择视频"></nav><footer><a href="./media-pendants.html">打开茧林探索</a></footer></main><script src="../public/data/media-stage5a.js"></script><script>
(()=>{const items=window.PojianMediaConfig.videos,id=new URLSearchParams(location.search).get('video'),item=items.find(v=>v.id===id);const player=document.querySelector('#player'),status=document.querySelector('#status');if(!item){document.querySelector('#title').textContent='未找到这段影像';status.textContent='请从下方选择一段视频。';player.hidden=true;}else{document.querySelector('#title').textContent=item.label;document.title=item.label+' · 茧林影像';player.src='../public/assets/videos/'+item.file;player.addEventListener('error',()=>{status.classList.add('error');status.textContent='视频未能加载，请确认完整工程目录与播放文件都在，或尝试使用其他浏览器。';});}const nav=document.querySelector('#videos');for(const v of items){const a=document.createElement('a');a.href='./media-video.html?video='+encodeURIComponent(v.id);a.textContent=v.label;if(v.id===id)a.setAttribute('aria-current','page');nav.append(a);}})();
</script></body></html>
